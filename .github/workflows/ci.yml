name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    env:
      HYPOTHESIS_PROFILE: ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy -p paydar -p paydar_contracts -p paydar_fixtures -p paydar_eval
      - run: uv run lint-imports
      - run: uv run pytest -p no:cacheprovider
      - run: uv export --frozen --no-emit-workspace --format requirements-txt > "$RUNNER_TEMP/req.txt"
      - run: uv run pip-audit --strict --disable-pip -r "$RUNNER_TEMP/req.txt"
  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  images:
    runs-on: ubuntu-latest
    needs: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv python install 3.12 && uv sync --frozen
      - name: Build vault-api for amd64 and arm64
        run: |
          for arch in amd64 arm64; do
            docker buildx build --platform linux/$arch --load -t paydar/vault-api:dev-$arch services/vault-api
          done
      - run: uv run pytest services/vault-api/tests/image -v -p no:cacheprovider
        env:
          PAYDAR_IMAGE_TESTS: "1"
          PAYDAR_PLATFORMS: linux/amd64,linux/arm64
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: paydar/vault-api:dev-amd64
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: paydar/vault-api:dev-arm64
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: paydar/vault-api:dev-amd64
          format: spdx-json
          artifact-name: sbom-vault-api.spdx.json
