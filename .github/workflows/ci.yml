name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    env:
      HYPOTHESIS_PROFILE: ci
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy -p paydar -p paydar_contracts
      - run: uv run lint-imports
      - run: uv run pytest -p no:cacheprovider
      - run: uv export --frozen --no-emit-workspace --format requirements-txt > "$RUNNER_TEMP/req.txt"
      - run: uv run pip-audit --strict --disable-pip -r "$RUNNER_TEMP/req.txt"
  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  images:
    runs-on: ubuntu-latest
    needs: python
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.12 && uv sync --frozen
      - name: Build vault-api for amd64 and arm64
        run: |
          for arch in amd64 arm64; do
            docker buildx build --platform linux/$arch --load -t paydar/vault-api:dev-$arch services/vault-api
          done
      - run: uv run pytest services/vault-api/tests/image -v -p no:cacheprovider
        env:
          PAYDAR_IMAGE_TESTS: "1"
          PAYDAR_PLATFORMS: linux/amd64,linux/arm64
      - uses: aquasecurity/trivy-action@v0.28.0
        with:
          image-ref: paydar/vault-api:dev-amd64
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true
      - uses: aquasecurity/trivy-action@v0.28.0
        with:
          image-ref: paydar/vault-api:dev-arm64
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true
      - uses: anchore/sbom-action@v0
        with:
          image: paydar/vault-api:dev-amd64
          format: spdx-json
          artifact-name: sbom-vault-api.spdx.json
