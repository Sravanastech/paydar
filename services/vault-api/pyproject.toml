[project]
name = "paydar-vault-api"
version = "0.0.0"
requires-python = ">=3.12,<3.13"
dependencies = ["paydar-contracts"]

[tool.uv.sources]
paydar-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paydar"]
